[package]
name = "oxiformula"
version = "0.11.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/oxihep/oxiformula"
documentation = "https://oxihep.github.io/oxiformula/oxiformula/"
readme = "README.md"
keywords = ["root", "tformula", "expression", "parser", "hep"]
categories = ["science", "mathematics", "parser-implementations"]
description = "ROOT's TFormula in pure Rust: parse, evaluate, compile and differentiate formulas, and write them back as ROOT compiles them, checked against ROOT"

[dependencies]
# Until oxistats is on crates.io it is a git dependency. `version` is kept so
# the switch is just dropping `git`/`tag`.
oxistats = { git = "https://github.com/oxihep/oxistats", tag = "v0.2.1", version = "0.2.1" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
# Casts that can lose information: fixed (`From`, `try_from`) or justified
# where they stand.
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
